name: qrmart_owner
description: Flutter owner app scaffold for qrMart.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  http: ^1.2.1
  http_parser: ^4.1.2
  image_picker: ^1.1.2
